[project]
name = "cyberathlete-api"
version = "0.1.0"
description = "CyberAthlete API (docs/02-architecture.md §5)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    # The Rust domain core through PyO3 — ADR-004 option B. Built from source by `uv sync`, so a
    # Rust toolchain is now part of setting the API up, here and in CI.
    "cyberathlete-core",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv]
package = false

[tool.uv.sources]
cyberathlete-core = { path = "../../core-rs/bindings/pyo3" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "integration: needs a real Postgres — docker compose locally, a service container in CI",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^lint_fixtures/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
