packages:
  - apps/mobile
  - packages/shared

# Refuse to install on a Node or pnpm outside the pins in package.json.
engineStrict: true

# pnpm runs no dependency's install script unless it is listed here. esbuild (drizzle-kit) and
# unrs-resolver (the import resolver in eslint-config-expo) each fetch a native binary.
# react-native-libsodium's only script unpacks the prebuilt libsodium shipped inside its own package
# (`tar -xzf libsodium/build.tgz`), which the Android build links; it downloads nothing (task 003).
allowBuilds:
  esbuild: true
  react-native-libsodium: true
  unrs-resolver: true

# CI fails on any high or critical audit finding (04 §10), except these, each accepted with its reason.
# Revisit whenever a patched version exists, or if the package ever reaches the app bundle.
auditConfig:
  ignoreGhsas:
    # image-size ≤2.0.2, denial of service from a crafted image (ICNS; JXL/HEIF). No patched version.
    # Reached only through Metro, which bundles images the project itself provides, at build time on a
    # developer's machine or in CI. Nothing in it ships in the app or parses user input.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.24'
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - '@expo/ui@57.0.18'
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-glass-effect@57.0.3
  - expo-keep-awake@57.0.2
  - expo-linking@57.0.10
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo-router@57.0.21
  - expo-splash-screen@57.0.9
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo@57.0.22
  - expo-secure-store@57.0.4
  - expo-sqlite@57.0.3
  - '@formatjs/icu-messageformat-parser@3.5.18'
  - '@formatjs/intl-getcanonicallocales@3.2.12'
  - '@formatjs/intl-locale@5.3.11'
  - '@formatjs/intl-localematcher@0.9.0'
  - '@formatjs/intl-pluralrules@6.3.15'
  - '@formatjs/intl-supportedvaluesof@2.3.10'
  - intl-messageformat@11.2.15
