packages:
  - apps/mobile
  - packages/shared

# Refuse to install on a Node or pnpm outside the pins in package.json.
engineStrict: true

# pnpm runs no dependency's install script unless it is listed here. Both fetch a native binary:
# esbuild for drizzle-kit, unrs-resolver for the import resolver in eslint-config-expo.
allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.24'
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - '@expo/ui@57.0.18'
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-glass-effect@57.0.3
  - expo-keep-awake@57.0.2
  - expo-linking@57.0.10
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo-router@57.0.21
  - expo-splash-screen@57.0.9
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo@57.0.22
  - expo-secure-store@57.0.4
  - expo-sqlite@57.0.3
