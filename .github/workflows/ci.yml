# Quality gates — docs/06-operations.md §3 and docs/tasks/001-project-bootstrap.md § CI.
# Every boundary rule runs against known-bad fixtures here, so a rule that silently stops working fails.
# The `rust` job is core-rs's own (cargo deny, clippy, fmt, Android cross-compilation, ADR-004's
# spike); `api` and `shared` also need a Rust toolchain now, because `uv sync` builds the PyO3
# extension `cyberathlete-core` from source (task 017).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway container that exists for this job only; these are not secrets.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: cyberathlete
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username postgres --dbname cyberathlete"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cyberathlete_app:ci-app@127.0.0.1:5432/cyberathlete
      MIGRATION_DATABASE_URL: postgresql+psycopg://cyberathlete_migrator:ci-migrator@127.0.0.1:5432/cyberathlete
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ci-admin@127.0.0.1:5432/cyberathlete
      # An integration test that skips for want of a database is a failure here.
      CYBERATHLETE_REQUIRE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create the two database roles (ADR-011)
        env:
          PGPASSWORD: ci-admin
        run: >-
          psql --no-psqlrc -v ON_ERROR_STOP=1 --host 127.0.0.1 --username postgres --dbname cyberathlete
          -v dbname=cyberathlete -v migrator_password=ci-migrator -v app_password=ci-app
          -f ../../infra/postgres/roles.sql
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts seeds alembic/env.py
      - run: uv run lint-imports
      # Task 002: the migration applies, the seeds run, and the schema passes 03 §8 and §11, ADR-011
      # and ADR-013 — compared with the committed Drizzle snapshot, name for name.
      - name: Migrate, seed and check the schema
        run: |
          uv run alembic upgrade head
          uv run python -m seeds
          uv run python -m scripts.check_schema
      - run: uv run pytest
      - run: uv run pip-audit

  rust:
    name: core-rs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # INV-10: the crate-level half of the gate. clippy's disallowed-methods (clippy.toml) is the
      # call-level half; an import rule alone would see the first and miss the second.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core-rs/Cargo.toml
      # Runs every case in packages/shared/fixtures/round_to_increment.json — the same file the
      # Python and TypeScript suites read (task 017).
      - run: cargo test --workspace
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          # Matches task 017's device NDK, named by Gradle on the first Android build, never guessed.
          ndk-version: r27c
      - name: Android cross-compilation, all three targets (task 017's ADR-004 spike)
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o /tmp/android \
            --manifest-path bindings/uniffi/Cargo.toml build --release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

  shared:
    name: Shared types are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - uses: astral-sh/setup-uv@v6
      # pnpm before Node: setup-node caches the pnpm store, so pnpm must already exist. The version comes
      # from the packageManager pin in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the OpenAPI schema, the TypeScript types and the reference-data export
        run: |
          (cd apps/api && uv sync --locked && uv run python -m scripts.export_openapi)
          (cd apps/api && uv run python -m seeds.export)
          pnpm --filter @cyberathlete/shared generate:api
      - name: Fail if the committed copies are stale
        run: git diff --exit-code -- packages/shared/api packages/shared/seeds
      - run: pnpm --filter @cyberathlete/shared typecheck

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The schema check in the API job reads the committed snapshot, so it must match schema.ts.
      - name: The committed device migrations match the Drizzle schema
        run: |
          pnpm db:generate
          git diff --exit-code -- src/db/migrations
          test -z "$(git status --porcelain -- src/db/migrations)"
      - name: Every boundary rule reports its known-bad fixture
        run: pnpm lint:fixtures
      - run: pnpm check:platform-files
      - name: Both catalogs hold the same messages with the same arguments (INV-27)
        run: pnpm check:catalogs
      - run: pnpm test --ci
      # Task 011: every slot the mark fills holds exactly what the render step makes of its SVG source.
      - name: The committed brand assets match their render
        run: |
          pnpm render:brand
          git diff --exit-code -- assets/images src/ui/brand
          test -z "$(git status --porcelain -- assets/images src/ui/brand)"
      - run: pnpm audit --audit-level high

  android-config:
    name: Release build permits no cleartext
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm prebuild
        env:
          EXPO_NO_GIT_STATUS: "1"
      - name: Merge the release manifest, libraries included
        working-directory: apps/mobile/android
        run: ./gradlew :app:processReleaseMainManifest --no-daemon
      - run: pnpm check:release-cleartext
